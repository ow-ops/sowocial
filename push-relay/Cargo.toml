[package]
name = "sowocial-push-relay"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Forwards encrypted Web Push from fediverse servers to sowocial through Expo's push service"

[dependencies]
axum = "0.8"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
