[package]
name = "sowocial-link-preview"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
sable-link-preview = { git = "https://git.sable.moe/SableClient/link-preview.git", rev = "46c32b3", features = ["reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
uniffi = { version = "=0.31", features = ["tokio"] }
serde_json = "1"
url = "2"
webpki-root-certs = "1"
