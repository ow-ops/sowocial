appId: eu.owops.sowocial
name: A reply to the last post of the thread nests under it and says what it answers
---
- runFlow: subflows/sign-in.yaml
- scrollUntilVisible:
    element: ".*Stroopwafel thread part one.*"
- tapOn: ".*Stroopwafel thread part one.*"
- extendedWaitUntil:
    visible: ".*carol answers part two.*"
    timeout: 10000
- assertVisible: ".*carol answers part two.*Replying to @alice: Stroopwafel thread part two"
