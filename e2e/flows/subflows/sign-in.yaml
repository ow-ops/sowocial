appId: eu.owops.sowocial
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Server address or handle"
- inputText: "http://localhost:8080"
- tapOn: "Continue"
# iOS asks before opening the server's sign-in page; the app's own Continue stays behind the dialog.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: ".*Wants to Use.*"
          timeout: 10000
          optional: true
      - tapOn:
          text: "Continue"
          below: ".*share information.*"
          optional: true
# A fresh Android device shows Chrome's first-run screens before the sign-in page.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Stay signed out|Use without an account|Accept & continue"
          optional: true
      - tapOn:
          text: "No thanks|Got it"
          optional: true
- extendedWaitUntil:
    visible: "Allow|Email"
    timeout: 15000
# The browser keeps the server session between runs, so the form only shows the first time.
- runFlow:
    when:
      visible: "Email"
    commands:
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: "Email"
            - inputText: "bob@e2e.test"
            - tapOn: "Password"
      # Typing into Chrome sometimes lands before the field is ready.
      - runFlow:
          when:
            platform: Android
          commands:
            - retry:
                maxRetries: 2
                commands:
                  - tapOn:
                      id: "username"
                  - eraseText
                  - inputText: "bob@e2e.test"
                  - assertVisible: "bob@e2e.test"
            - tapOn:
                id: "password"
      - inputText: "Sowocial-e2e-Passw0rd!"
      - pressKey: Enter
      - tapOn:
          text: "Not Now"
          optional: true
# Chrome can still hold an earlier approval and go straight back to the app.
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
