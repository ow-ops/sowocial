---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Push relay image

on:
  push:
    branches:
      - main
    paths:
      - push-relay/**
      - .forgejo/workflows/push-relay-image.yml
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  IMAGE: git.ow-ops.eu/ow-ops/sowocial-push-relay
  CARGO_INCREMENTAL: 0
  SCCACHE_BUCKET: ow-oops-sccache
  SCCACHE_S3_KEY_PREFIX: sowocial
  SCCACHE_ENDPOINT: https://s3.gra.io.cloud.ovh.net
  SCCACHE_REGION: gra
  SCCACHE_S3_USE_SSL: 'true'

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: https://git.ow-ops.eu/ow-ops/kit/.forgejo/actions/rust@main
        with:
          workspace: push-relay
          cache-key: push-relay

      - name: Test
        run: cd push-relay && cargo test --locked

  image:
    name: Build and push image
    needs: check
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the image build
        id: image
        uses: https://git.ow-ops.eu/ow-ops/kit/.forgejo/actions/image-setup@main
        with:
          token: ${{ secrets.FORGE_TOKEN }}

      - name: Build and push
        uses: https://github.com/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
        with:
          context: push-relay
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.image.outputs.sha }}
            ${{ env.IMAGE }}:${{ steps.image.outputs.release }}
            ${{ env.IMAGE }}:main
          cache-from: type=s3,region=gra,bucket=ow-oops-sccache,endpoint_url=https://s3.gra.io.cloud.ovh.net,prefix=buildkit/sowocial/,name=push-relay
          cache-to: type=s3,region=gra,bucket=ow-oops-sccache,endpoint_url=https://s3.gra.io.cloud.ovh.net,prefix=buildkit/sowocial/,name=push-relay,mode=max,ignore-error=true
          build-args: |
            SCCACHE_BUCKET=${{ env.SCCACHE_BUCKET }}
            SCCACHE_ENDPOINT=${{ env.SCCACHE_ENDPOINT }}
            SCCACHE_REGION=${{ env.SCCACHE_REGION }}
            SCCACHE_S3_KEY_PREFIX=${{ env.SCCACHE_S3_KEY_PREFIX }}
            SCCACHE_S3_USE_SSL=${{ env.SCCACHE_S3_USE_SSL }}
          secrets: |
            aws_access_key_id=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            aws_secret_access_key=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
