---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Push relay image

on:
  push:
    branches:
      - main
    paths:
      - push-relay/**
      - .forgejo/workflows/push-relay-image.yml
      - .forgejo/actions/rust/**
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  IMAGE: git.ow-ops.eu/ow-ops/sowocial-push-relay
  GIT_SHA: ${{ forgejo.sha }}
  CARGO_INCREMENTAL: 0
  SCCACHE_BUCKET: ow-oops-sccache
  SCCACHE_S3_KEY_PREFIX: sowocial
  SCCACHE_ENDPOINT: https://s3.gra.io.cloud.ovh.net
  SCCACHE_REGION: gra
  SCCACHE_S3_USE_SSL: 'true'

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.forgejo/actions/rust
        with:
          workspace: push-relay
          cache-key: push-relay

      - name: Test
        run: cd push-relay && cargo test --locked

  image:
    name: Build and push image
    needs: check
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to registry
        uses: https://github.com/docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: git.ow-ops.eu
          username: owl-bot
          password: ${{ secrets.FORGE_TOKEN }}

      - name: Name the image
        id: tags
        run: |-
          echo "sha=${GIT_SHA::7}" >> "${GITHUB_OUTPUT}"
          echo "release=main-${GIT_SHA::7}-$(git show -s --format=%ct HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: https://github.com/docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: push-relay
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.release }}
            ${{ env.IMAGE }}:main
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,ignore-error=true
          build-args: |
            SCCACHE_BUCKET=${{ env.SCCACHE_BUCKET }}
            SCCACHE_ENDPOINT=${{ env.SCCACHE_ENDPOINT }}
            SCCACHE_REGION=${{ env.SCCACHE_REGION }}
            SCCACHE_S3_KEY_PREFIX=${{ env.SCCACHE_S3_KEY_PREFIX }}
            SCCACHE_S3_USE_SSL=${{ env.SCCACHE_S3_USE_SSL }}
          secrets: |
            aws_access_key_id=${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
            aws_secret_access_key=${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
