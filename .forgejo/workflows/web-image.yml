---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Web image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  IMAGE: git.ow-ops.eu/ow-ops/sowocial-web
  GIT_SHA: ${{ forgejo.sha }}

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: https://github.com/actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: |-
          corepack enable
          pnpm install --frozen-lockfile

      - name: Generate Expo types
        run: pnpm exec expo customize tsconfig.json

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

  image:
    name: Build and push image
    needs: check
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "${REGISTRY_TOKEN}" | docker login git.ow-ops.eu -u "${{ forgejo.actor }}" --password-stdin

      - name: Build
        run: |-
          docker build \
            --tag "${IMAGE}:${GIT_SHA::7}" \
            --tag "${IMAGE}:main" \
            .

      - name: Push
        run: |-
          docker push "${IMAGE}:${GIT_SHA::7}"
          docker push "${IMAGE}:main"
