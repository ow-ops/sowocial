---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Checks

on:
  workflow_call:

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: https://git.ow-ops.eu/ow-ops/kit/.forgejo/actions/setup@main

      - name: Generate Expo types
        run: pnpm exec expo customize tsconfig.json

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

  deny:
    name: Audit the relay's dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: https://github.com/dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: https://github.com/taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.22.0

      - name: Deny
        run: cargo deny --manifest-path push-relay/Cargo.toml --all-features check

  machete:
    name: Find unused relay dependencies
    runs-on: light
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-machete
        uses: https://github.com/taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-machete@0.10.1

      - name: Machete
        run: cargo-machete push-relay

  typos:
    name: Check spelling
    runs-on: light
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install typos-cli
        uses: https://github.com/taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: typos-cli@1.52.2

      - name: Typos
        run: typos

  taplo:
    name: Check the TOML formatting
    runs-on: light
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install taplo-cli
        uses: https://github.com/taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: taplo-cli@0.10.0

      - name: Taplo
        run: taplo fmt --check
