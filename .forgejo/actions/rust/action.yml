name: Setup Rust
description: Installs a Rust toolchain, sccache and the Cargo cache.

inputs:
  toolchain:
    description: The rustup toolchain.
    required: false
    default: stable
  targets:
    description: Extra rustup targets, comma-separated.
    required: false
    default: ''
  workspace:
    description: The folder holding Cargo.toml.
    required: true
  cache-key:
    description: rust-cache's shared-key, one per dependency tree.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: https://github.com/dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}

    - name: Install sccache
      uses: https://github.com/taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
      with:
        tool: sccache@0.18.0

    # With sccache on, the compiled crates come from the bucket and only the registry is cached here.
    - name: Cache Rust artifacts
      uses: https://github.com/Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.workspace }}
        shared-key: ${{ inputs.cache-key }}
        cache-on-failure: true
        cache-targets: ${{ env.RUSTC_WRAPPER == '' }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
