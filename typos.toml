[files]
extend-exclude = [
  "pnpm-lock.yaml",
  "Cargo.lock",
  "target/",
  "node_modules/",
  # Generated by uniffi-bindgen-react-native.
  "modules/link-preview/cpp/generated/",
  # French copy trips the English dictionary.
  "src/i18n/locales/fr/",
  "fastlane/metadata/*/fr-FR/",
]

[default]
extend-ignore-re = [
  # Base64 keys in the relay's tests and the web push test script.
  "[A-Za-z0-9_-]{40,}",
  # The signing certificate fingerprint in the README.
  "(?:[0-9A-F]{2}:){8,}[0-9A-F]{2}",
]

[default.extend-words]
# Child sexual abuse and exploitation, in the child safety page.
csae = "csae"
# The simulator UDID.
udid = "udid"
# A DID used in a test.
abd = "abd"
# The uniffi template's own typo.
intialize = "intialize"
